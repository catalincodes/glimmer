<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <title>Glimmer - Stream Test</title>
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 flex flex-col items-center justify-center p-8">
    <div class="flex flex-col gap-4">
      <h1>Glimmer</h1>
      <div class="flex flex-col gap-2">
          <textarea class="w-full bg-zinc-900 border border-zinc-800 rounded-lg placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-zinc-600 resize-none" id="messageInput" placeholder="Tell me what do you need ..." rows="4" cols="50"></textarea>
          <button class="self-end bg-zinc-100 text-zinc-950 font-medium px-4 py-2 rounded-lg hover:bg-zinc-200 transition-colors" id="sendBtn">Send</button>
      </div>
      <div class="bg-zinc-900/50 border border-zinc-800/50 rounded-lg p-4 font-mono whitespace-pre-wrap text-zinc-100" id="output" style="margin-top: 20px; font-family: monospace; white-space: pre-wrap;"></div>
    </div>

      <script>
          document.getElementById('sendBtn').addEventListener('click', async () => {
              const outputDiv = document.getElementById('output');
              outputDiv.textContent = '';

              try {
                  const response = await fetch('http://localhost:5275/chat', {
                    method: 'POST',
                    headers: {
                       'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ Message: document.getElementById('messageInput').value })
                  });

                  const reader = response.body.getReader();
                  const decoder = new TextDecoder();

                  while (true) {
                      const { value, done } = await reader.read();
                      if (done) break;

                      const chunk = decoder.decode(value, { stream: true });
                      outputDiv.textContent += chunk;
                  }
              } catch (error) {
                  console.error('Streaming failed:', error);
              }
          });
      </script>
  </body>
</html>
