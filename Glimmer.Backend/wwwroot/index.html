<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <title>Glimmer - Stream Test</title>
  </head>
  <body>
      <h1>Glimmer Stream Test</h1>
      <button id="startBtn">Start Stream</button>
      <div id="output" style="margin-top: 20px; font-family: monospace; white-space: pre-wrap;"></div>

      <script>
          document.getElementById('startBtn').addEventListener('click', async () => {
              const outputDiv = document.getElementById('output');
              outputDiv.textContent = '';

              try {
                  const response = await fetch('http://localhost:5275/stream');
                  const reader = response.body.getReader();
                  const decoder = new TextDecoder();

                  while (true) {
                      const { value, done } = await reader.read();
                      if (done) break;

                      const chunk = decoder.decode(value, { stream: true });
                      outputDiv.textContent += chunk;
                  }
              } catch (error) {
                  console.error('Streaming failed:', error);
              }
          });
      </script>
  </body>
</html>
