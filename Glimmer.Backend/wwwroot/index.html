<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <title>Glimmer - Stream Test</title>
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-end p-8">

    <!-- Header / Title -->
    <header class="flex-1 w-full max-w-3xl mx-auto overflow-y-auto p-4 flex flex-col gap-4">
        <h1>Glimmer</h1>
    </header>
    
    <!-- Scrollable Container -->
    <div id="chatContainer" class="flex-1 max-w-3xl w-full mx-auto overflow-y-auto flex flex-col gap-6 py-4 pr-2">
    </div>

    <!-- Input Area-->
    <div class="flex flex-col gap-2 w-full max-w-3xl mx-auto">
        <textarea class="w-full bg-zinc-900 border border-zinc-800 rounded-lg placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-zinc-600 resize-none" id="messageInput" placeholder="Tell me what do you need ..." rows="4" cols="50"></textarea>
        <div class="flex justify-between items-center">
          <span class="text-xs text-zinc-500">Press <strong>Ctrl + Enter</strong> to send</span>
          <button class="bg-zinc-100 text-zinc-950 font-medium px-4 py-2 rounded-lg hover:bg-zinc-200 transition-colors cursor-pointer text-sm" id="sendBtn">Send</button>
        </div>
    </div>

      <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        async function handleSend() {
          const promptText = messageInput.value.trim();
          //Abort early if empty
          if (!promptText) return;

          //Clear input box
          messageInput.value = '';

          //User Message
          const userMsgWrapper = document.createElement('div');
          userMsgWrapper.className = 'flex items-start gap-3 justify-end';
          userMsgWrapper.innerHTML = `
            <div class="bg-zinc-800 border border-zinc-700 rounded-lg p-4 max-w-xl font-mono text-sm whitespace-pre-wrap text-zinc-100">${escapeHtml(promptText)}</div>
            <div class="w-8 h-8 rounded-full bg-zinc-700 flex items-center justify-center text-xs font-bold text-zinc-300 shrink-0">U</div>
          `;
          chatContainer.appendChild(userMsgWrapper);

          //Glimmer Message
          const glimmerMsgWrapper = document.createElement('div');
          glimmerMsgWrapper.className = 'flex items-start gap-4';
          glimmerMsgWrapper.innerHTML = `
            <div class="w-8 h-8 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-xs font-bold text-zinc-100 shrink-0">G</div>
            <div class="flex flex-col gap-1 max-w-xl w-full">
              <span class="text-xs font-semibold text-zinc-400">Glimmer</span>
              <div class="bg-zinc-900/50 border border-zinc-800/50 rounded-lg p-4 font-mono text-sm whitespace-pre-wrap text-zinc-100 response-text"></div>
            </div>
          `;
          chatContainer.appendChild(glimmerMsgWrapper);
          const responseDiv = glimmerMsgWrapper.querySelector('.response-text');

          //Scroll to bottom
          chatContainer.scrollTop = chatContainer.scrollHeight;

          try {
            const response = await fetch('http://localhost:5275/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Message: promptText })
                });

            if (!response.ok) throw new Error('Network response was not ok');
            
            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while(true) {
              const { value, done } = await reader.read();
              if (done) break;

              const chunk = decoder.decode(value, { stream: true });
              responseDiv.textContent += chunk;

              chatContainer.scrollTop = chatContainer.scrollHeight;
            }
          } catch (error) {
            console.error('Streaming failed:', error);
            responseDiv.textContent += '\n[Error: Failed to stream response from backend]'
          }
        }

        sendBtn.addEventListener('click', handleSend);

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                handleSend();
            };
        });


        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
      </script>
  </body>
</html>
